components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    GovernanceDecision:
      type: string
      enum:
      - ALLOW
      - HUMAN_REVIEW
      - BLOCK
      x-owner-student: 1
    PolicyEffect:
      type: string
      enum:
      - ALLOW
      - HUMAN_REVIEW
      - BLOCK
      x-owner-student: 1
    PolicyResult:
      type: string
      enum:
      - ALLOW
      - HUMAN_REVIEW
      - BLOCK
      - NO_MATCH
      - ERROR
      x-owner-student: 1
    PolicyOperator:
      type: string
      enum:
      - EQ
      - NEQ
      - IN
      - NOT_IN
      - GT
      - GTE
      - LT
      - LTE
      - EXISTS
      x-owner-student: 1
    RiskLevel:
      type: string
      enum:
      - LOW
      - MEDIUM
      - HIGH
