# Core services (postgres + backend) start by default.
# Student 3's services (frontend, tracing) are in the "full" profile so that
# backend work is never blocked while their files are not pushed yet:
#   docker compose up -d --build                    -> postgres + backend
#   docker compose --profile full up -d --build     -> everything

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      # Inside Docker the other services are reached by service name.
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      JAEGER_QUERY_URL: http://jaeger:16686
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  otel-collector:
    profiles: ["full"]
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:latest}
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  jaeger:
    profiles: ["full"]
    image: ${JAEGER_IMAGE:-jaegertracing/jaeger:latest}
    ports:
      - "16686:16686"

  frontend:
    profiles: ["full"]
    build: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      VITE_USE_MOCKS: ${VITE_USE_MOCKS}
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
