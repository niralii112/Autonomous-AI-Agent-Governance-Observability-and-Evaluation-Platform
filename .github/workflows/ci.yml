name: CI

on:
  pull_request:
  push:
    branches: [main, develop, anika/agent-governance-backend, nirali/backend-governance]

jobs:
  backend:
    name: Backend tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: governance_user
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: governance_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U governance_user -d governance_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # the integration tests WIPE this database, which exists only for this job
      TEST_DATABASE_URL: postgresql+psycopg://governance_user:ci_only_password@localhost:5432/governance_test
      DATABASE_URL: postgresql+psycopg://governance_user:ci_only_password@localhost:5432/governance_test
      POSTGRES_PASSWORD: ci_only_password
      JWT_SECRET_KEY: ci-only-jwt-secret-0123456789abcdef0123456789
      EXECUTION_GRANT_SECRET: ci-only-grant-secret-0123456789abcdef012345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run the test suite
        working-directory: backend
        run: python -m pytest tests -q

  contracts:
    name: Contract checks
    runs-on: ubuntu-latest
    # Student 2's risk, evaluation and agent-run endpoints do not match the contract yet, so this job reports
    # but does not block. When `python scripts/check_contracts.py --strict` is green, DELETE the next line.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Compare the code with contracts/openapi.yaml
        run: python scripts/check_contracts.py --strict

  frontend:
    name: Frontend types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Generated types are up to date and the code type-checks
        working-directory: frontend
        run: |
          npm run gen:types
          git diff --exit-code src/types/generated/api.d.ts
          npm run check:types
