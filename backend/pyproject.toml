[project]
name = "agent-governance-backend"
version = "1.0.0"
description = "Autonomous AI Agent Governance, Observability and Evaluation Platform - backend"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: no database or network needed",
    "api: needs the test database",
    "integration: needs several modules together",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
